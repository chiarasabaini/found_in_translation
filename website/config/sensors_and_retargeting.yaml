# Smartgloves II, Face Mesh, Signal Cleaning, Prototype Selection, and Avatar Retargeting Config
# All CSV column lookups are header-driven using the patterns below (no hardcoded column indices).

smartgloves:
  # Local timestamp column is labeled [ms] in sample files, but values are microseconds (~83 Hz).
  device_label_col_index: 0
  local_timestamp_header: "Timestamp (device local) [ms]"
  global_timestamp_header: "Timestamp (global) [us]"
  local_timestamp_unit_scale_to_sec: 0.000001
  expected_sample_rate_hz: 83.33

  # Quaternion ordering in Smartgloves II TRANSFORM[3..6] and ORIENTATION[0..3]
  # UNVERIFIED ON REAL HARDWARE: assumed [qx, qy, qz, qw]. Change to "wxyz" if real data differs.
  quaternion_order: "xyzw"

  # Sensor names in Group 1 and Group 2
  sensors_group1:
    - "thumb"
    - "index"
    - "middle"
    - "ring"
    - "little finger"
    - "arm"

  sensors_group2:
    - "arm"
    - "thumb"
    - "index"
    - "middle"
    - "ring"
    - "little"
    - "arm_2"

  # Preferred source after Group 1 vs Group 2 comparison ("group2" uses EM-corrected transforms when valid)
  preferred_sensor_group: "group2"

  # Header matching templates (case-insensitive substring or regex patterns)
  header_patterns:
    group1:
      transform: "{sensor}_TRANSFORM[{i}]"
      angular_velocity: "{sensor}_ANGULAR_VELOCITY[{i}]"
      proper_acceleration: "{sensor}_PROPER_ACCELERATION[{i}]"
      status_flags: "{sensor}_STATUS_FLAGS"
    hub:
      orientation: "hub_ORIENTATION[{i}]"
      angular_velocity: "hub_imu_ANGULAR_VELOCITY[{i}]"
      proper_acceleration: "hub_imu_PROPER_ACCELERATION[{i}]"
      status_flags: "hub_STATUS_FLAGS"
    group2:
      transform: "em_{sensor}_TRANSFORM[{i}]"
      emf_residual: "em_{sensor}_relative_emf_residual"
      status_flags: "em_{sensor}_STATUS_FLAGS"

cleaning:
  # First row(s) are reset frames with identical positions and identity quaternions
  reset_position_signature: [-0.018835, 0.006585, 0.0]
  reset_position_tolerance: 0.0001
  min_quaternion_norm: 0.5
  max_emf_residual: 0.35
  zero_dropout_epsilon: 0.000001
  # 1-Euro smoothing filter parameters
  one_euro_min_cutoff: 2.2
  one_euro_beta: 0.08
  one_euro_d_cutoff: 1.0
  target_fps: 30

prototype_selection:
  # Options: "medoid_dtw" or "dba"
  method: "medoid_dtw"
  dtw_window_ratio: 0.20

retargeting:
  # Axis remap from Smartgloves II coordinate space to VRM/Three.js (+X left, +Y up, +Z forward)
  # UNVERIFIED ON REAL HARDWARE: identity/default mounting orientation assumed.
  axis_remap_euler_deg:
    right: [0.0, 0.0, 0.0]
    left: [0.0, 0.0, 0.0]

  # Heuristic distribution of a single finger sensor's flexion angle across 3 phalanges
  finger_curl_weights:
    thumb: [0.40, 0.35, 0.25]
    index: [0.45, 0.35, 0.20]
    middle: [0.45, 0.35, 0.20]
    ring: [0.45, 0.35, 0.20]
    little: [0.45, 0.35, 0.20]

  # Anatomical arm lengths (meters) for simple 2-bone analytical IK from shoulder -> anchor
  arm_lengths:
    upper_arm: 0.28
    lower_arm: 0.25

  # Neutral rest pose fade frames at start and end of every exported clip
  fade_frames: 8

  # Face Mesh 52 ARKit blendshapes -> avatar morph target dictionary
  face_blendshape_map:
    jawOpen: "mouthOpen"
    mouthSmileLeft: "mouthSmile"
    mouthSmileRight: "mouthSmile"
    mouthPucker: "mouthPucker"
    mouthFrownLeft: "mouthFrown"
    mouthFrownRight: "mouthFrown"
    browInnerUp: "browUp"
    browDownLeft: "browDown"
    browDownRight: "browDown"
    eyeBlinkLeft: "eyeBlinkLeft"
    eyeBlinkRight: "eyeBlinkRight"
    cheekPuff: "cheekPuff"
